[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentskill-kit"
version = "0.1.0"
description = "Create, lint, security scan, test, share and export agent skills (SKILL.md) for Claude Code, Cursor, Codex, Hermes and more."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Lethe044" }]
keywords = [
    "agent-skills", "skill-md", "ai-agents", "claude-code", "cursor", "codex", "llm",
    "linter", "security-scanner", "prompt-injection", "developer-tools", "cli", "ollama", "groq",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Lethe044/agentskill-kit"
Documentation = "https://github.com/Lethe044/agentskill-kit/tree/main/docs"
Issues = "https://github.com/Lethe044/agentskill-kit/issues"
Changelog = "https://github.com/Lethe044/agentskill-kit/blob/main/CHANGELOG.md"
Registry = "https://lethe044.github.io/agentskill-kit/"

[project.scripts]
askit = "agentskill_kit.cli:main"
agentskill = "agentskill_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentskill_kit = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
